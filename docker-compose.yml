version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: pawpals_postgres
    environment:
      POSTGRES_USER: pawpals
      POSTGRES_PASSWORD: pawpals
      POSTGRES_DB: pawpals
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pawpals']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pawpals_redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  uploads:
